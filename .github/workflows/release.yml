# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# It runs the tests, builds the installer and the portable zip with the
# tag's version, and attaches them with a SHA256SUMS.txt. A tag with a
# suffix (v0.2.0-beta.1) becomes a pre-release. GitHub counts each
# asset's downloads; see README ("Download counts").
#
# Third-party actions are pinned to full commit SHAs, as in ci.yml.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # create the release and upload its files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }} # passed as data, never pasted into scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Version from the tag
        id: version
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') {
            Write-Error "Tag '$env:TAG' is not a version such as v0.1.0 or v0.2.0-beta.1"
            exit 1
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing Ebur $version"

      - name: Ensure Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      # build.ps1 builds the frontend, runs every test, builds the three
      # programs (stamped with the version) and makes the zip and installer.
      - name: Test and build
        run: ./build/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Checksums
        working-directory: dist
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = "ebur-setup-$v.exe", "ebur-$v-windows-x64.zip"
          foreach ($f in $files) { if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 } }
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $ghArgs = @(
            'release', 'create', $env:TAG,
            "dist/ebur-setup-$v.exe", "dist/ebur-$v-windows-x64.zip", 'dist/SHA256SUMS.txt',
            '--title', "Ebur $v",
            '--generate-notes',
            '--verify-tag'
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
