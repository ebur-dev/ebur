# Runs on every push to main and every pull request: formatting, vet,
# tests, a cross-platform check of the core (NFR-12) and a full release
# build whose installer and zip are attached to the run.
#
# Third-party actions are pinned to full commit SHAs (the version is in
# the comment), so a moved or compromised tag cannot change what runs.
# Dependabot (.github/dependabot.yml) proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and build (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # The app embeds frontend/dist, so it must exist before vet and tests.
      - name: Build the window's frontend
        working-directory: app/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Check formatting (gofmt)
        run: |
          $files = gofmt -l app build cli core helper internal manifest
          if ($files) { Write-Host "Run gofmt -w on:"; $files; exit 1 }

      - name: Vet
        run: go vet ./...

      - name: Vet the core for Linux and macOS (NFR-12)
        run: |
          foreach ($os in 'linux', 'darwin') {
            $env:GOOS = $os
            go vet ./core/... ./cli/... ./internal/... ./helper/...
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Test
        run: go test -count=1 ./...

      - name: Ensure Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build release
        run: ./build/build.ps1 -Version "0.1.0-dev.${{ github.run_number }}" -SkipTests

      - name: Upload installer and zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ebur-0.1.0-dev.${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
