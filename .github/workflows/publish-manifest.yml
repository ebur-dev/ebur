# Signs manifest/runtimes.json and publishes it for installed copies of
# Ebur (SEC-02, SEC-08). Runs when the manifest changes on the default
# branch (e.g. after merging a manifest-bot pull request) or by hand.
#
# The list and its Ed25519 signature are assets of the "manifest" release
# (a pre-release, so it never shows as the latest Ebur version). Ebur
# fetches them daily from
#   https://github.com/ebur-dev/ebur/releases/download/manifest/runtimes.json
# and uses the list only if the signature verifies against the public key
# built into it (core/catalog) and the list is newer than the one it has.
# Installed copies can fetch it once the repository is public.
#
# Needs the repository secret MANIFEST_SIGNING_KEY: the base64 private key
# made by `go run ./build/manifest-sign keygen`. The signing step refuses a
# key that does not match the public key in core/catalog.
name: Publish manifest

on:
  push:
    branches: [main]
    paths: ['manifest/runtimes.json']
  workflow_dispatch:

permissions:
  contents: write # create the "manifest" release and upload its files

concurrency:
  group: publish-manifest
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Sign
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          if [ -z "$MANIFEST_SIGNING_KEY" ]; then
            echo "::error::The MANIFEST_SIGNING_KEY secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p out
          cp manifest/runtimes.json out/runtimes.json
          go run ./build/manifest-sign sign -in out/runtimes.json -out out/runtimes.json.sig
          go run ./build/manifest-sign verify -in out/runtimes.json -sig out/runtimes.json.sig

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view manifest >/dev/null 2>&1; then
            gh release create manifest --prerelease --target "${{ github.sha }}" \
              --title "Runtime manifest (signed)" \
              --notes "The signed list of runtime versions that installed copies of Ebur check daily. Updated automatically; not an Ebur release."
          fi
          # The signature goes up first: a client that fetches between the two
          # uploads gets a pair that does not verify and keeps its current list.
          gh release upload manifest out/runtimes.json.sig --clobber
          gh release upload manifest out/runtimes.json --clobber
          echo "Published the manifest generated $(jq -r .generated out/runtimes.json)." >> "$GITHUB_STEP_SUMMARY"
