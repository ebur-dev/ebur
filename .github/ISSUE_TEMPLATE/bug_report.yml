name: Bug report
description: Something in Ebur does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Found a **security** problem? Please do not use this form; see [SECURITY.md](https://github.com/ebur-dev/ebur/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error message, if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ebur new shop --laravel`
        2. Open https://shop.test
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ebur version
      description: Run `ebur --version`, or see the installer's file name.
      placeholder: ebur version 0.1.0-beta.3
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ebur doctor`
      description: Run it in Ebur's terminal (tray menu > Open terminal) and paste the result. Check it does not contain anything private first.
      render: text
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other local stacks you have installed (XAMPP, WampServer, Laragon, Docker, WSL), antivirus software, relevant lines from Ebur's Logs tab, screenshots.
